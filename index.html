<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Un ramo para ti 🏎️💐</title>
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Exo+2:wght@400;600&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060c; --cyan:#35e0ff; --cyan-soft:#bff6ff; --orange:#ff7a1a; --gold:#ffd27a; --text:#e8f7ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:'Exo 2',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  button{font:inherit;cursor:pointer}

  /* ---------- Loader ---------- */
  #loader{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:var(--bg);z-index:50;transition:opacity .8s}
  #loader.gone{opacity:0;pointer-events:none}
  .spinner{width:54px;height:54px;border-radius:50%;border:3px solid rgba(53,224,255,.15);border-top-color:var(--cyan);
    box-shadow:0 0 18px rgba(53,224,255,.4);animation:spin 1s linear infinite}
  #loader p{margin:0;color:var(--cyan-soft);letter-spacing:.04em}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Intro ---------- */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 18px calc(16vh + env(safe-area-inset-bottom));pointer-events:none;z-index:10;
    background:radial-gradient(ellipse at 50% 38%,transparent 35%,rgba(0,0,0,.55) 100%);transition:opacity 1s}
  #intro.gone{opacity:0}
  #introText{font-family:'Bungee',sans-serif;font-weight:400;font-size:clamp(22px,6.6vw,46px);line-height:1.25;text-align:center;
    max-width:720px;min-height:2.6em;margin:0;color:#ffb070;
    text-shadow:0 0 6px #ff7a1a,0 0 18px #ff5a00,0 0 42px #ff3d00}
  .cursor{display:inline-block;width:.09em;height:.95em;background:currentColor;margin-left:.12em;vertical-align:-.1em;animation:blink 1s steps(1) infinite}
  .cursor.orange{background:var(--orange);box-shadow:0 0 8px var(--orange)}
  @keyframes blink{50%{opacity:0}}
  #startBtn{pointer-events:none;margin-top:30px;opacity:0;transform:translateY(12px);transition:opacity .8s,transform .8s;
    color:#fff;font-weight:600;font-size:17px;letter-spacing:.02em;border:0;border-radius:999px;padding:15px 30px;
    background:linear-gradient(135deg,#ff8a1a,#ff2d55);box-shadow:0 0 26px rgba(255,106,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
  #startBtn.show{opacity:1;transform:none;pointer-events:auto;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 42px rgba(255,106,0,.95),inset 0 1px 0 rgba(255,255,255,.35);transform:scale(1.04)}}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;text-align:center;padding:calc(16px + env(safe-area-inset-top)) 16px 0;
    pointer-events:none;z-index:5;opacity:0;transform:translateY(-14px);transition:opacity 1.4s,transform 1.4s}
  #hud.show{opacity:1;transform:none}
  #hud h1{margin:0;font-family:'Playfair Display',serif;font-style:italic;font-weight:900;font-size:clamp(28px,8vw,54px);line-height:1.08;
    color:#ffd27a;text-shadow:0 0 8px #ff9a1a,0 0 24px #ff6a00,0 3px 0 #a8430a}
  #hud .sub{margin:8px 0 0;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:clamp(17px,4.6vw,24px);
    color:#ffe2a6;text-shadow:0 0 10px rgba(255,160,40,.8)}
  #hud .hint{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:6px 14px;border-radius:999px;font-size:14px;
    color:var(--cyan-soft);background:rgba(4,24,36,.55);border:1px solid rgba(53,224,255,.45);box-shadow:0 0 14px rgba(53,224,255,.25)}
  #hud .hint b{color:var(--cyan)}

  .round-btn{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;z-index:6;
    border:2px solid var(--cyan);background:rgba(4,22,34,.7);color:var(--cyan);display:grid;place-items:center;
    box-shadow:0 0 16px rgba(53,224,255,.55),inset 0 0 14px rgba(53,224,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity 1s,transform .2s}
  .round-btn.show{opacity:1;pointer-events:auto}
  .round-btn:active{transform:scale(.92)}
  .round-btn svg{width:26px;height:26px}
  #musicBtn{left:18px} #letterBtn{right:18px}
  #letterBtn.ready{animation:pulseCyan 1.3s ease-in-out infinite}
  @keyframes pulseCyan{50%{box-shadow:0 0 34px rgba(53,224,255,1),inset 0 0 18px rgba(53,224,255,.5);transform:scale(1.08)}}

  /* ---------- Tarjeta de mensaje ---------- */
  #card{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));z-index:20;
    transform:translate(-50%,calc(100% + 40px));transition:transform .7s cubic-bezier(.2,.9,.2,1);
    padding:22px 20px 20px;border-radius:24px;border:2px solid var(--cyan);
    background:linear-gradient(180deg,rgba(6,42,58,.93),rgba(3,16,26,.96));
    box-shadow:0 0 24px rgba(53,224,255,.55),inset 0 0 34px rgba(53,224,255,.12)}
  #card.show{transform:translate(-50%,0)}
  #card h2{margin:0 34px 6px;text-align:center;font-family:'Bungee',sans-serif;font-weight:400;text-transform:uppercase;
    font-size:clamp(19px,5.6vw,28px);line-height:1.15;color:#8ff3ff;text-shadow:0 0 8px #35e0ff,0 0 22px #0bb5ff}
  #card .frase{margin:0 0 14px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:17px;color:var(--cyan-soft)}
  #card .msg{border-left:4px solid var(--cyan);background:rgba(0,0,0,.28);border-radius:14px;padding:14px 16px}
  #card .msg h3{margin:0 0 8px;font-family:'Bungee',sans-serif;font-weight:400;font-size:14px;color:#5fe6ff;text-shadow:0 0 8px rgba(53,224,255,.6)}
  #card .msg p{margin:0;font-size:17px;line-height:1.55;min-height:4.65em}
  .close{position:absolute;top:12px;right:14px;width:38px;height:38px;border:0;background:none;color:var(--cyan);font-size:32px;line-height:1;
    text-shadow:0 0 10px var(--cyan)}

  /* ---------- Carta ---------- */
  #letter{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.62);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s}
  #letter.show{opacity:1;pointer-events:auto}
  #letter .panel{position:relative;width:min(540px,100%);max-height:82vh;overflow:auto;padding:30px 24px 26px;border-radius:24px;
    border:2px solid #ffb347;background:linear-gradient(180deg,rgba(40,18,6,.94),rgba(14,8,4,.97));
    box-shadow:0 0 28px rgba(255,140,30,.55),inset 0 0 40px rgba(255,140,30,.12);transform:scale(.94);transition:transform .6s}
  #letter.show .panel{transform:none}
  #letter h2{margin:0 36px 16px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:900;font-size:clamp(26px,7vw,38px);
    color:#ffd27a;text-shadow:0 0 10px #ff8a1a}
  #letter .close{color:#ffb347;text-shadow:0 0 10px #ff8a1a}
  #letterBody p{margin:0 0 14px;font-size:17px;line-height:1.7;color:#fff1de}
  #letterSign{text-align:right;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:20px;color:#ffd27a;
    opacity:0;transition:opacity 1s}
  #letterSign.show{opacity:1}

  /* ---------- Extras ---------- */
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 34%);transform:translate(-50%,10px);z-index:25;opacity:0;pointer-events:none;
    padding:12px 20px;border-radius:16px;text-align:center;font-weight:600;background:rgba(4,22,34,.85);border:1px solid var(--cyan);
    box-shadow:0 0 22px rgba(53,224,255,.5);transition:opacity .6s,transform .6s;width:max-content;max-width:calc(100% - 32px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .heart{position:fixed;bottom:-50px;z-index:40;pointer-events:none;animation:rise linear forwards;filter:drop-shadow(0 0 8px rgba(255,60,120,.8))}
  @keyframes rise{to{transform:translateY(-115vh) rotate(var(--r));opacity:.2}}
  #error{position:fixed;inset:0;display:none;place-content:center;padding:24px;text-align:center;z-index:60;background:var(--bg)}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loader"><div class="spinner"></div><p>Preparando tu sorpresa…</p></div>

<section id="intro">
  <h1 id="introText"></h1>
  <button id="startBtn"></button>
</section>

<header id="hud">
  <h1 id="hudTitle"></h1>
  <p class="sub" id="hudSub"></p>
  <div class="hint"><span id="hudHint"></span><b id="counter">0/7</b></div>
</header>

<button id="musicBtn" class="round-btn" aria-label="Pausar o reproducir música"></button>
<button id="letterBtn" class="round-btn" aria-label="Abrir carta">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/><path d="M12 17.2s-2.6-1.5-2.6-3.1c0-.9.7-1.5 1.4-1.5.5 0 .9.3 1.2.7.3-.4.7-.7 1.2-.7.7 0 1.4.6 1.4 1.5 0 1.6-2.6 3.1-2.6 3.1Z" fill="currentColor" stroke="none"/></svg>
</button>

<div id="card" role="dialog" aria-modal="true">
  <button class="close" id="cardClose" aria-label="Cerrar">×</button>
  <h2 id="cardTitle"></h2>
  <p class="frase" id="cardFrase"></p>
  <div class="msg"><h3 id="cardLabel"></h3><p id="cardText"></p></div>
</div>

<div id="letter" role="dialog" aria-modal="true">
  <div class="panel">
    <button class="close" id="letterClose" aria-label="Cerrar">×</button>
    <h2 id="letterTitle"></h2>
    <div id="letterBody"></div>
    <div id="letterSign"></div>
  </div>
</div>

<div id="toast"></div>
<div id="error"><p>Tu navegador no pudo cargar la animación 3D 😢<br>Intenta abrir el enlace en Chrome o Safari actualizados.</p></div>

<script src="config.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const C = window.CONFIG;
const $ = (s) => document.querySelector(s);
const TAU = Math.PI * 2;
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = (t) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// ===================================================================
//  Renderer, escena, cámara y post-procesado (brillo neón)
// ===================================================================
const canvas = $('#scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  $('#error').style.display = 'grid'; $('#loader').classList.add('gone'); throw e;
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#03050b');
scene.fog = new THREE.FogExp2('#03050b', 0.016);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
scene.add(camera);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.42, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const controls = new OrbitControls(camera, canvas);
controls.enabled = false;
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.rotateSpeed = 0.6;
controls.minAzimuthAngle = -1.1; controls.maxAzimuthAngle = 1.1;
controls.minPolarAngle = 0.95; controls.maxPolarAngle = 1.85;

// Luces
scene.add(new THREE.HemisphereLight('#7cc4ff', '#0a0612', 0.35));
const key = new THREE.DirectionalLight('#ffffff', 1.7); key.position.set(4, 8, 7); scene.add(key);
const rim = new THREE.DirectionalLight('#2bb8ff', 3.0); rim.position.set(-6, 4, -6); scene.add(rim);
const warm = new THREE.PointLight('#ff7a1a', 40, 16, 2); warm.position.set(3.5, 1.5, 5); scene.add(warm);

// ===================================================================
//  Texturas generadas por código
// ===================================================================
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const dotTex = (() => {
  const c = makeCanvas(64, 64), x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.22, 'rgba(255,255,255,.8)');
  g.addColorStop(0.5, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return canvasTex(c);
})();
const petalTex = (() => {
  const c = makeCanvas(64, 256), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 256, 0, 0);
  g.addColorStop(0, '#062a6e'); g.addColorStop(0.25, '#1f6fc8'); g.addColorStop(0.62, '#62bff0'); g.addColorStop(1, '#c4ecff');
  x.fillStyle = g; x.fillRect(0, 0, 64, 256);
  x.strokeStyle = 'rgba(16,80,160,.35)'; x.lineWidth = 1.3;
  for (let i = 0; i < 5; i++) { const px = 12 + i * 10; x.beginPath(); x.moveTo(32, 256); x.quadraticCurveTo(px, 150, 32 + (px - 32) * 0.55, 12); x.stroke(); }
  const e = x.createLinearGradient(0, 0, 64, 0);
  e.addColorStop(0, 'rgba(255,255,255,.4)'); e.addColorStop(0.18, 'rgba(255,255,255,0)');
  e.addColorStop(0.82, 'rgba(255,255,255,0)'); e.addColorStop(1, 'rgba(255,255,255,.4)');
  x.fillStyle = e; x.fillRect(0, 0, 64, 256); return canvasTex(c);
})();
const leafTex = (() => {
  const c = makeCanvas(64, 256), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 256, 0, 0);
  g.addColorStop(0, '#1d5a24'); g.addColorStop(0.5, '#3f9a45'); g.addColorStop(1, '#6cc463');
  x.fillStyle = g; x.fillRect(0, 0, 64, 256);
  x.strokeStyle = 'rgba(190,240,170,.55)'; x.lineWidth = 2; x.beginPath(); x.moveTo(32, 256); x.lineTo(32, 6); x.stroke();
  x.lineWidth = 1; x.strokeStyle = 'rgba(190,240,170,.3)';
  for (let i = 0; i < 9; i++) { const y = 230 - i * 24; x.beginPath(); x.moveTo(32, y); x.lineTo(4, y - 26); x.moveTo(32, y); x.lineTo(60, y - 26); x.stroke(); }
  return canvasTex(c);
})();
const centerTex = (() => {
  const c = makeCanvas(256, 256), x = c.getContext('2d');
  x.fillStyle = '#121b26'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 700; i++) {
    const r = Math.sqrt(i / 700) * 124, a = i * 2.39996;
    x.fillStyle = i % 3 ? '#2a394b' : '#3b4f66';
    x.beginPath(); x.arc(128 + Math.cos(a) * r, 128 + Math.sin(a) * r, 3.3, 0, TAU); x.fill();
  }
  return canvasTex(c);
})();
const wingTex = (() => {
  const c = makeCanvas(128, 128), x = c.getContext('2d');
  x.shadowColor = '#35e0ff'; x.shadowBlur = 10; x.strokeStyle = '#9ff4ff'; x.lineWidth = 5; x.fillStyle = 'rgba(53,224,255,.16)';
  x.beginPath(); x.moveTo(4, 60); x.bezierCurveTo(20, 0, 118, -6, 112, 30); x.bezierCurveTo(108, 52, 40, 64, 4, 64); x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(4, 68); x.bezierCurveTo(50, 70, 96, 96, 70, 118); x.bezierCurveTo(50, 132, 14, 100, 4, 70); x.closePath(); x.fill(); x.stroke();
  return canvasTex(c);
})();
const streakTex = (() => {
  const c = makeCanvas(256, 16), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 256, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.85, 'rgba(180,240,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,1)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 16);
  const v = x.createLinearGradient(0, 0, 0, 16);
  v.addColorStop(0, 'rgba(0,0,0,1)'); v.addColorStop(0.5, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,1)');
  x.globalCompositeOperation = 'destination-out'; x.fillStyle = v; x.fillRect(0, 0, 256, 16);
  return canvasTex(c);
})();
function flameDecalTex(frontOnRight) {
  const w = 512, h = 128, c = makeCanvas(w, h), x = c.getContext('2d');
  x.save();
  if (!frontOnRight) { x.translate(w, 0); x.scale(-1, 1); }
  const g = x.createLinearGradient(w, 0, 0, 0);
  g.addColorStop(0, '#fff27a'); g.addColorStop(0.35, '#ffb000'); g.addColorStop(0.7, '#ff4a00'); g.addColorStop(1, '#d4001f');
  x.fillStyle = g; x.strokeStyle = 'rgba(120,0,10,.9)'; x.lineWidth = 3;
  const tongues = [[0.08, 0.30], [0.02, 0.50], [0.10, 0.72], [0.26, 0.20], [0.30, 0.84], [0.44, 0.14], [0.50, 0.90]];
  for (const [tx, ty] of tongues) {
    x.beginPath(); x.moveTo(w * 0.98, h * 0.5);
    x.quadraticCurveTo(w * 0.62, h * (ty < 0.5 ? 0.06 : 0.94), w * tx, h * ty);
    x.quadraticCurveTo(w * 0.62, h * 0.5, w * 0.98, h * 0.5);
    x.fill(); x.stroke();
  }
  x.restore();
  x.save();
  x.font = "44px 'Bungee', sans-serif"; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.translate(w / 2, h / 2 + 2); x.transform(1, 0, -0.22, 1, 0, 0);
  x.lineJoin = 'round'; x.lineWidth = 10; x.strokeStyle = '#b3001b'; x.strokeText('HOT WHEELS', 0, 0);
  x.fillStyle = '#ffe14d'; x.fillText('HOT WHEELS', 0, 0);
  x.restore();
  return canvasTex(c);
}

// ===================================================================
//  Fondo: estrellas, brillo, chispas, estrellas fugaces, mariposas
// ===================================================================
const stars = (() => {
  const n = 1800, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(rand(60, 110));
    pos.set([v.x, v.y, v.z], i * 3);
    const k = rand(0.5, 1.4), cyan = Math.random() < 0.3;
    col.set(cyan ? [0.6 * k, 0.9 * k, 1.2 * k] : [k, k, k], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.55, map: dotTex, vertexColors: true, transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
  scene.add(p); return p;
})();

const backGlow = new THREE.Mesh(new THREE.PlaneGeometry(26, 26),
  new THREE.MeshBasicMaterial({ map: dotTex, color: new THREE.Color('#062a4d'), transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));

function petalGeometry(len, wid, curl, cup = 0.35) {
  const g = new THREE.PlaneGeometry(1, 1, 6, 18);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i), v = p.getY(i) + 0.5;
    const hw = wid * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(v, 0.72)), 0.85);
    p.setXYZ(i, u * 2 * hw, v * len, curl * len * v * v + Math.pow(u * 2, 2) * hw * cup);
  }
  g.computeVertexNormals();
  return g;
}

const _m = new THREE.Matrix4(), _mh = new THREE.Matrix4(), _mp = new THREE.Matrix4();
const _rz = new THREE.Matrix4(), _rx = new THREE.Matrix4(), _tr = new THREE.Matrix4();
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _v = new THREE.Vector3();
function updateFlowers(t) {
  flowers.forEach((f, fi) => {
    const b = f.bloom, sc = Math.max(0.0001, f.size * easeOutBack(b)), open = easeOutCubic(b);
    _e.set(Math.sin(t * 0.8 + f.sway) * 0.05, Math.cos(t * 0.7 + f.sway) * 0.05, 0);
    _q.copy(f.q).multiply(_q2.setFromEuler(_e));
    _mh.compose(f.pos, _q, _s.set(sc, sc, sc));
    for (let j = 0; j < OUTER; j++) {
      _rz.makeRotationZ(j / OUTER * TAU);
      _rx.makeRotationX(THREE.MathUtils.lerp(1.4, 0.14 + (j % 2) * 0.09, open));
      _tr.makeTranslation(0, 0.14, 0);
      _mp.multiplyMatrices(_rz, _rx).multiply(_tr);
      outerIM.setMatrixAt(fi * OUTER + j, _m.multiplyMatrices(_mh, _mp));
    }
    for (let j = 0; j < INNER; j++) {
      _rz.makeRotationZ((j + 0.5) / INNER * TAU);
      _rx.makeRotationX(THREE.MathUtils.lerp(1.45, 0.5 + (j % 2) * 0.1, open));
      _tr.makeTranslation(0, 0.1, 0.05);
      _mp.multiplyMatrices(_rz, _rx).multiply(_tr);
      innerIM.setMatrixAt(fi * INNER + j, _m.multiplyMatrices(_mh, _mp));
    }
    f.center.position.copy(f.pos); f.center.quaternion.copy(_q); f.center.scale.setScalar(sc);
  });
  outerIM.instanceMatrix.needsUpdate = true;
  innerIM.instanceMatrix.needsUpdate = true;
}

function box(mat, sx, sy, sz, x, y, z) { const m = new THREE.Mesh(carParts.boxGeo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); return m; }
function makeWheel() {
  const P = carParts, g = new THREE.Group(), sp = new THREE.Group(); g.add(sp);
  sp.add(new THREE.Mesh(P.tireGeo, P.tire), new THREE.Mesh(P.rimGeo, P.chrome));

  const cap = new THREE.Mesh(P.capGeo, P.redline); cap.position.z = 0.12; sp.add(cap);
  const rl = new THREE.Mesh(P.redlineGeo, P.redline); rl.position.z = 0.105; sp.add(rl);
  return { g, sp };
}
function makeCar(hex, index) {
  const P = carParts, color = new THREE.Color(hex);
  const paint = new THREE.MeshPhysicalMaterial({ color, metalness: 0.6, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 0.55 });
  const root = new THREE.Group(), model = new THREE.Group();
  model.position.y = -0.85; root.add(model);
  model.add(new THREE.Mesh(P.bodyGeo, paint), new THREE.Mesh(P.cabGeo, P.glass));
  // alerón
  model.add(box(P.carbon, 0.55, 0.06, 1.95, -1.95, 1.44, 0));
  model.add(box(P.carbon, 0.1, 0.28, 0.08, -1.9, 1.27, 0.6), box(P.carbon, 0.1, 0.28, 0.08, -1.9, 1.27, -0.6));
  // luces, parrilla, escapes
  model.add(box(P.head, 0.1, 0.12, 0.42, 2.24, 0.72, 0.56), box(P.head, 0.1, 0.12, 0.42, 2.24, 0.72, -0.56));
  model.add(box(P.tail, 0.08, 0.1, 0.55, -2.26, 0.92, 0.55), box(P.tail, 0.08, 0.1, 0.55, -2.26, 0.92, -0.55));
  model.add(box(P.carbon, 0.1, 0.16, 1.1, 2.27, 0.4, 0));
  for (const z of [0.4, -0.4]) { const ex = new THREE.Mesh(P.cylGeo, P.chrome); ex.position.set(-2.22, 0.36, z); model.add(ex); }
  // calcomanías de llamas
  const dR = new THREE.Mesh(P.decalGeo, decalR); dR.position.set(0, 0.72, 1.031);
  const dL = new THREE.Mesh(P.decalGeo, decalL); dL.position.set(0, 0.72, -1.031); dL.rotation.y = Math.PI;
  model.add(dR, dL);
  // ruedas
  const spinners = [];
  for (const [x, z] of [[1.32, 0.86], [-1.3, 0.86], [1.32, -0.86], [-1.3, -0.86]]) {
    const w = makeWheel(); w.g.position.set(x, 0.43, z);
    if (z < 0) w.g.rotation.y = Math.PI;
    w.sp.userData.dir = z < 0 ? 1 : -1;
    model.add(w.g); spinners.push(w.sp);
  }
  // resplandor de neón debajo
  const glowMat = new THREE.MeshBasicMaterial({ map: dotTex, color: color.clone().multiplyScalar(1.4).add(new THREE.Color(0.15, 0.15, 0.15)), transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending });
  const glow = new THREE.Mesh(P.glowGeo, glowMat); glow.position.y = 0.03; model.add(glow);
  // zona tocable
  const hit = new THREE.Mesh(P.hitGeo, P.hitMat); hit.position.y = 0.85; model.add(hit);
  hit.userData.carIndex = index;
  root.visible = false;
  scene.add(root);
  return { root, spinners, glowMat, hit, color, index, phase: rand(0, TAU), hover: 0, mode: 'hidden' };
}

function typer(el, text, speed = 38, cursorClass = '') {

  el.textContent = '';
  const span = document.createElement('span'), cur = document.createElement('span');
  cur.className = 'cursor ' + cursorClass; el.append(span, cur);
  const done = new Promise((resolve) => {
    let i = 0;
    const step = () => {
      if (cancelled) return resolve(false);
      span.textContent = text.slice(0, ++i);
      if (i >= text.length) return resolve(true);
      timer = setTimeout(step, speed + (/[,.!?…]/.test(text[i - 1]) ? speed * 5 : 0));

    step();
  });

}

      c.flyScale0 = INTRO_SCALE; c.t0 = now + 0.1; c.dur = 2.9; c.qStart = c.root.quaternion.clone();
    } else {

function onOpeningFrame(t) {
  const e = t - tOpen;

  const k = clamp01(e / 3.4), ek = easeInOutCubic(k);
  const target = INTRO_TARGET.clone().lerp(MAIN_TARGET, ek);
  camera.position.lerpVectors(camFrom, mainCamPos(), ek);
  camera.lookAt(target);
  // anillo del inicio
  const rk = clamp01(e / 1.0);
  introRing.scale.setScalar(1 + rk * 1.5);
  introRing.children.forEach((m) => { m.material.opacity = 1 - rk; });
  introRing.visible = rk < 1;
  // jarrón
  vase.scale.setScalar(Math.max(0.0001, easeOutBack(clamp01((e - 0.3) / 1.1))));
  // tallos
  const g = easeOutCubic(clamp01((e - 0.9) / 1.8));
  flowers.forEach((f) => f.stemGeo.setDrawRange(0, Math.floor(g * TUBULAR) * RADIAL * 6));
  leaves.forEach((l) => { const s = easeOutBack(clamp01((g - l.userData.t) / 0.3)); l.scale.setScalar(Math.max(0.0001, s * l.userData.s)); });
  // flores
  flowers.forEach((f) => { f.bloom = clamp01((e - 1.9 - f.delay) / 1.3); });
  // mariposas
  butterflies.forEach((b) => b.scale.setScalar(easeOutCubic(clamp01((e - 2.5) / 1.5))));

function updateCar(c, t, dt) {

const clock = new THREE.Clock();
function update(t, dt) {

  for (let i = 0; i < spd.length; i++) {
    let y = sp.getY(i) + spd[i] * dt;
    if (y > 6) y = -5;
    sp.setY(i, y); sp.setX(i, sp.getX(i) + Math.sin(t * 0.6 + i) * dt * 0.08);
  }
  sp.needsUpdate = true;
  // estrellas fugaces
  shootingStars.forEach((m) => {
    const u = m.userData;
    if (!m.visible) {
      u.wait -= dt;
      if (u.wait <= 0) {
        m.visible = true; u.life = 0; u.dur = rand(0.9, 1.4);
        u.dir.set(rand(0.55, 0.9), -rand(0.35, 0.6), 0).normalize();
        m.position.set(rand(-16, 4), rand(8, 13), rand(-12, -8));
        m.rotation.set(0, 0, Math.atan2(u.dir.y, u.dir.x));

    } else {
      u.life += dt; m.position.addScaledVector(u.dir, dt * 16);
      m.material.opacity = Math.sin(Math.PI * clamp01(u.life / u.dur));
      if (u.life > u.dur) { m.visible = false; u.wait = rand(1.5, 5); }

    const f = Math.sin(t * 13 + u.ph) * 1.05;
